; Builds the library examples with PlatformIO (development and CI only;
; Arduino IDE users open the examples from File > Examples > BLEeh).
;   pio run -d tools/examples_build                  # all examples, all boards
;   pio run -d tools/examples_build -e HBridgeCar_c3 -t upload
; Kept outside arduino/ so the library folder stays clean for Arduino users.
; Each src/<Example>.cpp just includes arduino/examples/<Example>/<Example>.ino.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps =
    BLEeh=symlink://../../arduino
    h2zero/NimBLE-Arduino@^2.5.1

[env:MinimalReceiver_c3]
board = seeed_xiao_esp32c3
build_src_filter = +<MinimalReceiver.cpp>

[env:HBridgeCar_c3]
board = seeed_xiao_esp32c3
build_src_filter = +<HBridgeCar.cpp>

[env:HBridgeCar_s3]
board = seeed_xiao_esp32s3
build_src_filter = +<HBridgeCar.cpp>
