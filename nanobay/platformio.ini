
[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
    ; Arduino core 3.3 (IDF 5.5) no longer pulls in the ROM GPIO matrix
    ; declarations that CRSFDude's half-duplex code calls.
    -include esp32c3/rom/gpio.h
lib_deps =
    BLEeh=symlink://../arduino   ; the library from this repository
    https://github.com/rngtng/CRSFDude.git
    h2zero/NimBLE-Arduino@^2.5.1
    olikraus/U8g2@^2.36.0
lib_ldf_mode = deep+

; ESP32-S3: the hardware-tested target (see docs/BRINGUP_NOTES.md).
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=0
    ; Arduino core 3.3 (IDF 5.5) no longer pulls in the ROM GPIO matrix
    ; declarations that CRSFDude's half-duplex code calls.
    -include esp32s3/rom/gpio.h
lib_deps =
    BLEeh=symlink://../arduino   ; the library from this repository
    https://github.com/rngtng/CRSFDude.git
    h2zero/NimBLE-Arduino@^2.5.1
    olikraus/U8g2@^2.36.0
lib_ldf_mode = deep+
